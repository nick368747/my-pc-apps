<style>
:root{
  --bg:#080b12;
  --panel:#111622;
  --text:#f4f7fb;
  --muted:#9aa6b8;
  --accent:#6d5dfc;
  --border:#252d3d;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:radial-gradient(circle at top,#17152f 0,#080b12 38%);
  color:var(--text);
}

header{
  padding:58px 20px 36px;
  text-align:center;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#101522;
  color:#aeb8ca;
  font-size:13px;
}

h1{
  font-size:clamp(38px,7vw,72px);
  margin:16px 0 8px;
  letter-spacing:-3px;
}

.hero{
  max-width:760px;
  margin:auto;
  color:var(--muted);
  font-size:17px;
  line-height:1.6;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:0 20px 60px;
}

.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin:20px 0 30px;
}

input{
  flex:1;
  min-width:220px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:14px 16px;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:var(--accent);
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.filter,
.fav-toggle{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:11px 14px;
  border-radius:10px;
  cursor:pointer;
}

.filter.active,
.filter:hover{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.fav-toggle.active,
.fav-toggle:hover{
  background:#c59b00;
  color:white;
  border-color:#c59b00;
}

.stats{
  color:var(--muted);
  margin:0 0 18px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}

.card{
  background:linear-gradient(145deg,var(--panel),#0e131d);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  display:flex;
  flex-direction:column;
  min-height:225px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#3b4560;
  box-shadow:0 12px 35px #0005;
}

.icon{
  font-size:34px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.num{
  font-size:12px;
  color:#667186;
}

.star{
  border:0;
  background:transparent;
  color:#ffd34e;
  font-size:20px;
  cursor:pointer;
  padding:0 0 0 5px;
}

.card h2{
  font-size:20px;
  margin:14px 0 7px;
}

.card p{
  color:var(--muted);
  line-height:1.45;
  margin:0 0 18px;
  flex:1;
}

.tag{
  font-size:12px;
  color:#b8c2d4;
  margin-bottom:14px;
}

.btn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:var(--accent);
  color:white;
  padding:12px;
  border-radius:11px;
  font-weight:700;
}

.btn:hover{
  filter:brightness(1.12);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:50px;
  display:none;
}

footer{
  text-align:center;
  color:#687489;
  border-top:1px solid var(--border);
  padding:28px 20px;
  font-size:13px;
}
</style>
</head>

<header>

</header>

<main class="wrap">

    <div class="filters" id="filters"></div>

  <div class="stats" id="stats"></div>

  <section class="grid" id="grid"></section>

  <div class="empty" id="empty">
    Keine App gefunden.

</main>

<footer>
  Links führen möglichst direkt zu den offiziellen Download-Seiten

</footer>

{n:121,name:"Amazon Music",icon:"🎵",cat:"Media",desc:"Musik und Podcasts von Amazon.",url:"https://music.amazon.de/"}

];


const grid=document.getElementById("grid");
const filters=document.getElementById("filters");
const search=document.getElementById("search");
const stats=document.getElementById("stats");
const empty=document.getElementById("empty");
const favToggle=document.getElementById("favToggle");


let active="Alle";


let favorites=new Set(
  JSON.parse(
    localStorage.getItem("myPcAppsFavorites") || "[]"
  ).map(Number)
);


favToggle.onclick=()=>{

  active =
    active==="Favoriten"
      ? "Alle"
      : "Favoriten";

  document
    .querySelectorAll(".filter")
    .forEach(x=>{
      x.classList.toggle(
        "active",
        x.textContent===active
      );
    });

  favToggle.classList.toggle(
    "active",
    active==="Favoriten"
  );

  render();
};


function toggleFavorite(id,e){

  e.stopPropagation();

  favorites.has(id)
    ? favorites.delete(id)
    : favorites.add(id);

  localStorage.setItem(
    "myPcAppsFavorites",
    JSON.stringify([...favorites])
  );

  render();
}


const cats=[
  "Alle",
  ...new Set(apps.map(a=>a.cat))
];


cats.forEach(c=>{

  const b=document.createElement("button");

  b.className =
    "filter" +
    (c==="Alle" ? " active" : "");

  b.textContent=c;

  b.onclick=()=>{

    active=c;

    favToggle.classList.remove("active");

    document
      .querySelectorAll(".filter")
      .forEach(x=>{
        x.classList.remove("active");
      });

    b.classList.add("active");

    render();
  };

  filters.appendChild(b);

});


function render(){

  const q =
    search.value
      .toLowerCase()
      .trim();

  const list=apps.filter(a=>

    (
      active==="Alle" ||

      (
        active==="Favoriten"
          ? favorites.has(a.n)
          : a.cat===active
      )
    )

    &&

    (`${a.name} ${a.cat} ${a.desc}`)
      .toLowerCase()
      .includes(q)

  );


  grid.innerHTML =
    list.map(a=>`

      <article class="card">

        <div class="top">

          <span class="icon">
            ${a.icon}
          </span>

          <span class="num">

            #${a.n}

            <button
              class="star"
              title="Favorit umschalten"
              aria-label="Favorit umschalten"
              onclick="toggleFavorite(${a.n}, event)"
            >
              ${favorites.has(a.n) ? "⭐" : "☆"}
            </button>

          </span>

        </div>


        <h2>
          ${a.name}
        </h2>


        <div class="tag">
          ${a.cat}
        </div>


        <p>
          ${a.desc}
        </p>


        <a
          class="btn"
          href="${a.url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Offizieller Download ↗
        </a>

      </article>

    `).join("");


  stats.textContent =
    `${list.length} von ${apps.length} Apps angezeigt`;


  empty.style.display =
    list.length ? "none" : "block";
}


search.addEventListener(
  "input",
  render
);


render();

</script>
